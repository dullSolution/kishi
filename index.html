<!DOCTYPE html>
<html>
<head>
    <title>Pollinations 图像生成</title>
    <style>
        .container { max-width: 800px; margin: 2rem auto; padding: 20px; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 1rem; }
        #output { margin-top: 2rem; text-align: center; }
        .error { color: red; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/boltcss/bolt.min.css">
</head>
<body>
    <div class="container">
        <form id="generateForm">
            <div class="input-group">
                <label for="prompt">描述内容 (必填):</label>
                <textarea id="prompt" rows="3" required></textarea>
            </div>
            
            <div class="input-group">
                <label for="model">选择模型:</label>
                <select id="model">
                    <option value="flux">Flux (默认)</option>
                    <option value="turbo">Turbo</option>
                </select>
            </div>

            <div class="input-group">
                <label>分辨率:</label>
                <input type="number" id="width" placeholder="宽 (默认 512)" min="128" max="1024">
                <input type="number" id="height" placeholder="高 (默认 512)" min="128" max="1024">
            </div>

            <div class="input-group">
                <label for="seed">随机种子 (可选):</label>
                <input type="number" id="seed">
            </div>

            <button type="submit">生成图像</button>
        </form>

        <div id="output"></div>
    </div>

    <script>
        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const output = document.getElementById('output');
            output.innerHTML = '<div>生成中...</div>';
	    var randomNumber = "111";	
            // 构造请求参数
            const prompt = encodeURIComponent(document.getElementById('prompt').value);
            const model = document.getElementById('model').value;
            const width = document.getElementById('width').value || 512;
            const height = document.getElementById('height').value || 512;
            
	    let randomUrl='https://www.random.org/integers/?num=1&min=1&max=16222&col=1&base=10&format=plain&rnd=new'

	    try{
		const res=await fetch(randomUrl)
		var text=await res.text()
		randomNumber=text
		console.log(randomNumber)
		
		}catch(error){
		console.log(error)
		}
            // 构建API URL
	const seed = document.getElementById('seed').value || randomNumber;

            let apiUrl = `https://image.pollinations.ai/prompt/${prompt}?model=${model}&width=${width}&height=${height}&nologo=true&seed=${seed}`;
            //if (seed) apiUrl += `&seed=${seed}`;

            try {
                // 创建图片并测试加载
                const img = new Image();
                img.src = apiUrl;
                
                img.onload = () => {
                    output.innerHTML = `
                        <img src="${apiUrl}" 
                            alt="生成的图像" 
                            style="max-width: 100%; border: 1px solid #ddd;">
                        <div style="margin-top: 1rem;">
                            <a href="${apiUrl}" download="generated-image.png" 
                               style="padding: 8px 16px; background: #007bff; color: white; text-decoration: none;">
                               下载图片
                            </a>
                        </div>
                    `;
                };

                img.onerror = () => {
                    output.innerHTML = '<div class="error">生成失败，请检查参数后重试</div>';
                };

            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = '<div class="error">请求发生错误</div>';
            }
        });
    </script>
</body>
</html>
